name: Stream Player Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - stream-player-rebuild
    paths:
      - 'stream-player-kotlin/**'
      - '.github/workflows/stream-player-kotlin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stream-player-kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$SDKMANAGER" "platforms;android-35"
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" "build-tools;35.0.0"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: stream-player-debug-apk
          path: stream-player-kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
